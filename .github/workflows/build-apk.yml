name: Build Telegram APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          NDK_VER=$(grep -rhoE 'ndkVersion\s*=?\s*"[^"]+"' --include=build.gradle . | head -1 | grep -oE '[0-9.]+' || true)
          NDK_VER=${NDK_VER:-21.4.7075529}
          echo "Using NDK $NDK_VER"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;$NDK_VER" "cmake;3.10.2.4988404" "platforms;android-34" "build-tools;34.0.0"

      - name: Inject API ID and Hash
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E 's|APP_ID = [0-9]+;|APP_ID = ${{ secrets.TG_API_ID }};|' $F
          sed -i -E 's|APP_HASH = "[^"]*";|APP_HASH = "${{ secrets.TG_API_HASH }}";|' $F
          grep -nE 'APP_ID|APP_HASH' $F

      - name: Add google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_B64 }}" | base64 -d > TMessagesProj_App/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: "**/build/outputs/apk/**/*.apk"