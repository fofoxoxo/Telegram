name: Build Telegram APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

env:
  PKG: com.nova.tgclient

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          NDK_VER=$(grep -rhoE 'ndkVersion\s*=?\s*"[^"]+"' --include=build.gradle . | head -1 | grep -oE '[0-9.]+' || true)
          NDK_VER=${NDK_VER:-21.4.7075529}
          echo "Using NDK $NDK_VER"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;$NDK_VER" "cmake;3.10.2.4988404" "platforms;android-34" "build-tools;34.0.0"

      - name: Inject API ID and Hash
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E 's|APP_ID = [0-9]+;|APP_ID = ${{ secrets.TG_API_ID }};|' $F
          sed -i -E 's|APP_HASH = "[^"]*";|APP_HASH = "${{ secrets.TG_API_HASH }}";|' $F
          grep -nE 'APP_ID|APP_HASH' $F | sed -E 's/"[^"]{6,}"/"***"/'

      - name: Change package name
        run: |
          for f in $(grep -rl 'org.telegram.messenger"' --include=build.gradle .); do
            sed -i "s|applicationId = \"org.telegram.messenger\"|applicationId = \"$PKG\"|" $f
          done
          grep -rn "applicationId" --include=build.gradle .

      - name: Remove Google services and Crashlytics plugins
        run: |
          for f in $(find . -name build.gradle); do
            sed -i -E "/com\.google\.gms/d; /apply plugin: 'com\.google\.firebase/d; /firebase-crashlytics-gradle/d" $f
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: "**/build/outputs/apk/**/*.apk"